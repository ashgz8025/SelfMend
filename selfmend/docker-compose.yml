version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       selfmend
      POSTGRES_USER:     selfmend
      POSTGRES_PASSWORD: selfmend_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfmend"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL:    postgresql://selfmend:selfmend_pass@postgres:5432/selfmend
      GROQ_API_KEY:    ${GROQ_API_KEY:-}
      FAITHFULNESS_THRESHOLD: "0.80"
      CONFIDENCE_THRESHOLD:   "0.70"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://selfmend:selfmend_pass@postgres:5432/selfmend
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  postgres_data:
